name: station-windows-probe
on:
  push:
    branches: [ci/station-windows-probe]
env:
  CARGO_TERM_COLOR: never
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stub station-viewer dist
        shell: bash
        run: |
          mkdir -p software/station/clients/station-viewer/dist
          echo '<!doctype html><title>station</title>' > software/station/clients/station-viewer/dist/index.html
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: nasm
        shell: bash
        run: |
          curl -sSL -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip
          unzip -q nasm.zip -d nasm && echo "$PWD/nasm/nasm-2.16.03" >> $GITHUB_PATH
      - name: build
        shell: bash
        run: |
          cargo update -p normfs -p normfs-types -p normfs-time 2>&1 | tail -3 || true
          cargo build --release -p station > build.log 2>&1 && echo "build ok" || echo "build FAILED"
          { grep -E "^error|error\[|error C[0-9]+|^warning: unused|fatal error" build.log | sort | uniq -c | head -60; } || true
          { grep -E "^error" -A12 build.log | head -150; } || true
          tail -3 build.log
      - name: run
        shell: bash
        run: |
          ls -la target/release/station.exe || exit 1
          ./target/release/station.exe --help | head -5
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/target/release/station.exe" --config "$GITHUB_WORKSPACE/.github/probe/station.yaml" --data-dir "$RUNNER_TEMP/sd" --tcp 127.0.0.1:8888 --web 127.0.0.1:8889 > station.log 2>&1 &
          sleep 20
          echo "== web"; curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8889/ || true
          echo "== normfs tcp"; python "$GITHUB_WORKSPACE/.github/probe/live.py" e2e || true
          echo "== data"; find "$RUNNER_TEMP/sd" -maxdepth 4 | head -30
          echo "== log"; { grep -E "ERROR|WARN|panick" station.log | head -30; } || true
          tail -15 station.log
